
name: Customer Churn MLOps Pipeline

on:
  push:
  pull_request:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "dvc[s3]"

      - name: Configure DagsHub credentials
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          test -n "$DAGSHUB_USER" || (echo "DAGSHUB_USER secret is missing" && exit 1)
          test -n "$DAGSHUB_TOKEN" || (echo "DAGSHUB_TOKEN secret is missing" && exit 1)
          dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"

      - name: Pull dataset from DagsHub
        run: dvc pull -r origin

      - name: Validate data
        run: python validation.py

      - name: Train model and enforce quality gate
        run: python train.py --check-quality-gate

      - name: Run automated tests
        run: python -m pytest -v
