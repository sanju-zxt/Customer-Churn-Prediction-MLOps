# =============================================================================
# GitHub Actions CI/CD Pipeline for Churn Prediction ML Service
# Build → Test → Scan → Deploy Staging → Canary → Prod
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - devops
  pull_request:
    branches:
      - main
      - master
      - devops
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      canary_weight:
        description: "Canary traffic percentage"
        required: false
        default: "25"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TF_VERSION: 1.6.6

jobs:
  # ============================================================================
  # Stage 1: Build and Lint
  # ============================================================================
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=long

      - name: Set image tag
        id: set-tag
        run: |
          TAG="${{ github.sha }}"
          echo "image-tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.set-tag.outputs.image-tag }}
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.set-tag.outputs.image-tag }}
          load: true

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

  # ============================================================================
  # Stage 2: Unit Tests
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml --junit-xml=test-results.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results.xml

  # ============================================================================
  # Stage 3: Security Scanning
  # ============================================================================
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ needs.build.outputs.image-tag }}"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ============================================================================
  # Stage 4: Integration Tests
  # ============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, test, scan]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: churn_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-httpx

      - name: Run integration tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/churn_db"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python -m pytest tests/test_api.py -v --timeout=30

  # ============================================================================
  # Stage 5: Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test, scan, integration-test]
    environment:
      name: staging
      url: https://staging.churn.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.31.0"

      - name: Set up Tofu
        uses: azure/setup-opentofu@v1
        with:
          version: ${{ env.TF_VERSION }}

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Placeholder for actual deployment commands
          echo "STAGING_DEPLOYMENT_COMPLETED=true" >> $GITHUB_ENV

      - name: Run smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Placeholder for smoke tests

      - name: Comment PR with staging link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ **Staging deployed successfully!**\n\nURL: https://staging.churn.example.com\nImage tag: `${{ needs.build.outputs.image-tag }}`\n\n[View dashboard](https://staging.churn.example.com/grafana)"
            })

  # ============================================================================
  # Stage 6: Canary Deployment to Production
  # ============================================================================
  canary:
    name: Canary Deployment
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.31.0"

      - name: Deploy canary to production
        run: |
          echo "Deploying canary to production with ${{ github.event.inputs.canary_weight || '25' }}% traffic..."
          # Placeholder for canary deployment commands

      - name: Canary health check
        run: |
          echo "Waiting for canary to stabilize (60s)..."
          sleep 60
          echo "Canary is healthy"

      - name: Monitor canary metrics
        run: |
          echo "Monitoring canary metrics for 5 minutes..."
          # Placeholder for metric monitoring

  # ============================================================================
  # Stage 7: Full Production Deployment
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: canary
    environment:
      name: production
      url: https://churn.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Kubernetes
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.31.0"

      - name: Deploy to production
        run: |
          echo "Deploying full production..."
          # Placeholder for production deployment commands

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          # Placeholder for verification

      - name: Notify on completion
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              description: "Deployed to production",
              context: "deployment/production"
            })

  # ============================================================================
  # Stage 8: Cleanup
  # ============================================================================
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging]
    if: always()
    steps:
      - name: Cleanup old images
        run: |
          echo "Cleaning up old images..."
          # Placeholder for image cleanup
