# =============================================================================
# Kubernetes Deployment for Backend with GPU Node Affinity
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-backend
  namespace: churn
  labels:
    app: churn-backend
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: churn-backend
  template:
    metadata:
      labels:
        app: churn-backend
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      # GPU Node Affinity
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/accelerator
                    operator: Exists
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/gpu
                    operator: Exists
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - churn-backend
                topologyKey: kubernetes.io/hostname
      # Tolerations for GPU nodes
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
        - key: "cloud.google.com/gke-accelerator"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      # Container definitions
      containers:
        - name: backend
          image: churn-backend:prod
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: churn-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: churn-secrets
                  key: redis-url
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.churn.svc.cluster.local:5000"
            - name: MODEL_PATH
              value: "/app/artifacts/model.joblib"
            - name: LOG_LEVEL
              value: "info"
            - name: OMP_NUM_THREADS
              value: "4"
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
              nvidia.com/gpu: 1
            limits:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: artifacts
              mountPath: /app/artifacts
            - name: logs
              mountPath: /app/logs
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      # Triton sidecar for inference
      initContainers:
        - name: triton-server
          image: nvcr.io/nvidia/tritonserver:24.10-py3
          imagePullPolicy: IfNotPresent
          args:
            - tritonserver
            - --model-repository=/models
            - --grpc-port=8001
            - --http-port=8000
            - --metrics-port=8002
          ports:
            - containerPort: 8001
              name: grpc
              protocol: TCP
            - containerPort: 8000
              name: triton-http
              protocol: TCP
            - containerPort: 8002
              name: metrics
              protocol: TCP
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
              nvidia.com/gpu: 1
            limits:
              memory: "4Gi"
              cpu: "2"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-repo
              mountPath: /models
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
      # Volumes
      volumes:
        - name: artifacts
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: model-repo
          configMap:
            name: triton-model-config
---
# =============================================================================
# Horizontal Pod Autoscaler based on GPU utilization
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: churn-backend-hpa
  namespace: churn
  labels:
    app: churn-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: churn-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # CPU utilization target
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory utilization target
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # External metric: GPU utilization via Prometheus
    - type: External
      external:
        metric:
          name: gpu_utilization
        target:
          type: AverageValue
          averageValue: "70"
    # External metric: Request latency from Prometheus
    - type: External
      external:
        metric:
          name: request_latency_seconds
        target:
          type: AverageValue
          averageValue: "0.5"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60