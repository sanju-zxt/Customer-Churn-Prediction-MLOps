# =============================================================================
# SealedSecrets for API Keys and Sensitive Configuration
# =============================================================================
# Note: This is a template. The actual secrets should be sealed using:
#   kubectl create secret generic churn-secrets \
#     --namespace=churn \
#     --from-literal=database-url=postgresql://postgres:password@postgres:5432/churn_db \
#     --from-literal=redis-url=redis://redis:6379/0 \
#     --from-literal=mlflow-tracking-uri=http://mlflow.churn.svc.cluster.local:5000 \
#     --from-literal=api-key=<YOUR_API_KEY> \
#   | kubeseal --format yaml --cert <cert> > kubernetes/sealed-secrets.yaml
# =============================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: churn-secrets
  namespace: churn
  annotations:
    sealedsecrets.bitnami.com/namespace: churn
    sealedsecrets.bitnami.com/creation-timestamp: "2026-10-30T00:00:00Z"
spec:
  # Encrypted values - this is a placeholder, use kubeseal to generate
  encryptedData:
    database-url: AgBy2...
    redis-url: AgBy2...
    mlflow-tracking-uri: AgBy2...
    api-key: AgBy2...
  template:
    metadata:
      name: churn-secrets
      namespace: churn
    type: Opaque
---
# =============================================================================
# Kubernetes Secret (fallback for local/non-production use)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: churn-secrets-local
  namespace: churn
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  database-url: cG9zdGdyZXNxbDovL3Bvc3RncmVzQHAvcG9zdGdyZXMvNTQzMy9jaHVybm5fZA==
  redis-url: cmVkaXM6Ly9yZWRpczozNzc5LzA=
  mlflow-tracking-uri: aHR0cDovL21sZmxvdw==
  api-key: YXV0aC1rZXktdmFsdWUtaGVyZQ==
---
# =============================================================================
# ConfigMap for Non-secret Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: churn-config
  namespace: churn
data:
  LOG_LEVEL: "info"
  MODEL_PATH: "/app/artifacts/model.joblib"
  PORT: "8000"
  OMP_NUM_THREADS: "4"
  TRITON_SERVER_URL: "http://churn-triton-svc.churn.svc.cluster.local:8000"
  PROMETHEUS_ENDPOINT: "http://churn-prometheus:9090"