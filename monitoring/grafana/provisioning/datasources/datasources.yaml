# =============================================================================
# Grafana Datasource Provisioning - Prometheus + Loki
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://churn-prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"
      exemplarSupport: true
    version: 1

  - name: Loki
    type: loki
    access: proxy
    url: http://churn-loki:3100
    jsonData:
      multiTenantEnabled: false
      polling: true
    version: 1

  - name: Tempo
    type: tempo
    access: proxy
    url: http://churn-tempo:3200
    jsonData:
      tracesToLogs:
        datasourceUid: Loki
        spanStartTime: "2006-01-02T15:04:05.000Z"
        spanEndTime: "2006-01-02T15:04:05.000Z"
    version: 1