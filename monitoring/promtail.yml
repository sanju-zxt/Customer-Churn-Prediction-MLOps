# =============================================================================
# Promtail Configuration - Log shipper for Loki
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          agent: promtail
          host: ${HOSTNAME}
    container_labels:
      promtail_job: backend
    container_name_reset: true
    pipeline_stages:
      # Parse JSON structured logs
      - json:
          expressions:
            time: time
            level: level
            msg: msg
            caller: caller
            trace_id: trace_id
            span_id: span_id
            request_id: request_id
            duration: duration
            status_code: status_code
          source: message
      # Add timestamp
      - timestamp:
          source: time
          format: RFC3339
      # Parse level for filtering
      - labels:
          level: level
      # Parse status codes
      - json:
          expressions:
            status_code: status_code
          if: status_code != ""
      # Parse request duration
      - json:
          expressions:
            duration: duration
          if: duration != ""
      # Replace fields with labels for efficient querying
      - labels:
          request_id: request_id
          trace_id: trace_id
      # Drop non-essential fields
      - json:
          expressions:
            {}: ""
          source: message
          if: msg != ""

  - job_name: frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: frontend
    container_labels:
      promtail_job: frontend
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            msg: msg
            caller: caller
      - timestamp:
          source: time
          format: RFC3339
      - labels:
          level: level
      - labels:
          job: frontend